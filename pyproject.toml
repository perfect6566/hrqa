[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrqa"
version = "1.0.0"
description = "Agentic AI HR Policy Assistant with RAG and MCP Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.12.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "chromadb>=0.4.22",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "tiktoken>=0.5.2",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",
    "src/api/main_recovered.py",
]

[tool.coverage.report]
# Fail CI when overall coverage drops below 40%. The plan targets 70%,
# but the gate starts much lower because:
#
# * tests/test_api_integration.py requires a live API server on
#   localhost:8000 and currently fails with ConnectError on CI (the
#   plan explicitly flagged this as "dead code on master" — fixing it
#   by switching to in-process TestClient is a P1 follow-up).
# * tests/test_hr_assistant.py has 2 tests that assert stale PTO
#   values that no longer match mock_data/pto_balances.json.
# * tests/test_mcp.py::test_all_tools_registered imports a non-existent
#   `mcp_server` symbol from src/mcp_server.app (it exposes
#   get_mcp_server() instead).
#
# In CI the run with all three pre-existing failures still measures
# ~45% coverage; 40 gives a small headroom for the same test suite
# running in slightly different environments. Bump this back to 70
# once the three pre-existing issues above are resolved and the
# coverage they unlock is measured.
fail_under = 40
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.setuptools.packages.find]
where = ["src"]
