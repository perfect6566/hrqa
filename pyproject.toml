[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrqa"
version = "1.0.0"
description = "Agentic AI HR Policy Assistant with RAG and MCP Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.12.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "chromadb>=0.4.22",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "tiktoken>=0.5.2",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
