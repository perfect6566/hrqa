name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python syntax check
        run: |
          python -m py_compile src/rag/*.py
          python -m py_compile src/mcp_server/*.py
          python -m py_compile src/agent/*.py
          python -m py_compile src/api/*.py
          echo "Syntax check passed!"

      - name: Run pytest with coverage
        # --cov-fail-under=40 is a temporary gate. The plan targets 70%;
        # see [tool.coverage.report] in pyproject.toml for the full list
        # of pre-existing test issues that currently cap coverage below
        # 70 and need to be resolved before raising the gate.
        run: |
          pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-branch \
            --cov-fail-under=40

  mcp-server-test:
    name: Test MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test MCP server endpoints
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.mcp_server.app import create_app
          from fastapi.testclient import TestClient
          app = create_app()
          assert app is not None, 'MCP app not created'
          # FastMCP 3.x: the FastMCP instance is no longer directly
          # ASGI-callable; expose its Starlette app via .http_app().
          asgi_app = app.http_app()
          print('MCP ASGI app created successfully')
          client = TestClient(asgi_app)

          response = client.get('/health')
          assert response.status_code == 200, 'Health check failed'
          print(f'Health check: {response.json()}')

          # Test tools endpoint
          response = client.get('/tools')
          assert response.status_code == 200, 'Tools list failed'
          tools = response.json()['tools']
          print(f'Found {len(tools)} tools')
          assert len(tools) >= 5, f'Expected at least 5 tools, got {len(tools)}'

          # Test tool call
          response = client.post('/tools/call', json={
              'name': 'lookup_employee_profile',
              'arguments': {'employee_id': 'EMP001'}
          })
          assert response.status_code == 200, 'Tool call failed'
          result = response.json()
          assert result.get('success') == True, 'Tool execution failed'

          print('All MCP server tests PASSED!')
          "

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, mcp-server-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          api_key: ${{ secrets.RENDER_API_KEY }}
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          wait_deploy: true
