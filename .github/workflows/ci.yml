name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Python syntax check
        run: |
          python -m py_compile src/rag/*.py
          python -m py_compile src/mcp/*.py
          python -m py_compile src/agent/*.py
          python -m py_compile src/api/*.py
          echo "Syntax check passed!"

      - name: Test imports
        run: |
          python -c "from src.rag import RAGPipeline; print('RAG imports OK')"
          python -c "from src.mcp.tools import HRTools; print('MCP tools OK')"
          python -c "from src.agent import AgentOrchestrator; print('Agent OK')"

      - name: Run MCP tool discovery test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.mcp.tools import HRTools
          tools = HRTools()

          # Test lookup_employee_profile
          result = tools.lookup_employee_profile(employee_id='EMP001')
          assert result['success'] == True, 'lookup_employee_profile failed'
          assert result['employee']['name'] == 'Alice Johnson', 'Wrong employee'
          print('lookup_employee_profile: PASS')

          # Test check_pto_balance
          result = tools.check_pto_balance(employee_id='EMP001')
          assert result['success'] == True, 'check_pto_balance failed'
          print('check_pto_balance: PASS')

          # Test lookup_benefits_status
          result = tools.lookup_benefits_status(employee_id='EMP001')
          assert result['success'] == True, 'lookup_benefits_status failed'
          print('lookup_benefits_status: PASS')

          # Test create_mock_hr_ticket
          result = tools.create_mock_hr_ticket(
              employee_id='EMP001',
              category='pto',
              subject='Test ticket',
              description='Test description'
          )
          assert result['success'] == True, 'create_mock_hr_ticket failed'
          print('create_mock_hr_ticket: PASS')

          # Test draft_hr_email
          result = tools.draft_hr_email(
              employee_id='EMP001',
              purpose='pto_request'
          )
          assert result['success'] == True, 'draft_hr_email failed'
          print('draft_hr_email: PASS')

          # Test check_policy_compliance
          result = tools.check_policy_compliance(
              employee_id='EMP001',
              policy_area='remote_work'
          )
          assert result['success'] == True, 'check_policy_compliance failed'
          print('check_policy_compliance: PASS')

          print('All MCP tool tests PASSED!')
          "

      - name: Test document loading (multi-format)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.rag.document_loader import DocumentLoader
          from src.rag.chunker import DocumentChunker

          loader = DocumentLoader('policies')
          docs = loader.load_documents()
          formats = set(d.get('metadata', {}).get('format') for d in docs)
          print(f'Loaded {len(docs)} documents in formats: {formats}')
          assert len(docs) > 0, 'No documents loaded'
          assert len(formats) >= 2, f'Expected at least 2 formats, got {formats}'

          chunker = DocumentChunker()
          chunks = chunker.chunk_documents(docs)
          print(f'Created {len(chunks)} chunks')
          assert len(chunks) > 0, 'No chunks created'

          print('Document loading test PASSED!')
          "

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  mcp-server-test:
    name: Test MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test MCP server endpoints
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.mcp.app import create_app
          from fastapi.testclient import TestClient
          app = create_app()
          assert app is not None, 'MCP app not created'
          # FastMCP 3.x: the FastMCP instance is no longer directly
          # ASGI-callable; expose its Starlette app via .http_app().
          asgi_app = app.http_app()
          print('MCP ASGI app created successfully')
          client = TestClient(asgi_app)

          response = client.get('/health')
          assert response.status_code == 200, 'Health check failed'
          print(f'Health check: {response.json()}')

          # Test tools endpoint
          response = client.get('/tools')
          assert response.status_code == 200, 'Tools list failed'
          tools = response.json()['tools']
          print(f'Found {len(tools)} tools')
          assert len(tools) >= 5, f'Expected at least 5 tools, got {len(tools)}'

          # Test tool call
          response = client.post('/tools/call', json={
              'name': 'lookup_employee_profile',
              'arguments': {'employee_id': 'EMP001'}
          })
          assert response.status_code == 200, 'Tool call failed'
          result = response.json()
          assert result.get('success') == True, 'Tool execution failed'

          print('All MCP server tests PASSED!')
          "

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, mcp-server-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          api_key: ${{ secrets.RENDER_API_KEY }}
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          wait_deploy: true
